# Add these locations inside the xiaotai.chat HTTPS server block.
location = /web-flasher {
    absolute_redirect off;
    return 308 /web-flasher/$is_args$args;
}

location ^~ /web-flasher/ {
    alias /opt/xiaotai-flasher/www/web-flasher/;
    index index.html;
    autoindex off;
    disable_symlinks if_not_owner from=/opt/xiaotai-flasher/;
    open_file_cache off;
    expires -1;
    error_page 404 = @xiaotai_flasher_not_found;

    location ^~ /web-flasher/assets/ {
        alias /opt/xiaotai-flasher/www/web-flasher/assets/;
        expires 1y;
    }

    location = /web-flasher/board-catalog/boards.json {
        alias /opt/xiaotai-flasher/board-catalog/boards.json;
        default_type application/json;
    }

    location ~ "^/web-flasher/board-catalog/firmware/(?<firmware_file>[A-Za-z0-9][A-Za-z0-9._+-]{0,249}\.bin)$" {
        alias /opt/xiaotai-flasher/board-catalog/firmware/$firmware_file;
        default_type application/octet-stream;
        expires 1y;
    }

    location /web-flasher/board-catalog/ {
        return 404;
    }
}

location @xiaotai_flasher_not_found {
    return 404;
}
